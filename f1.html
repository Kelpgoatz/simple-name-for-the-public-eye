<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Fixtures &amp; Championships</title>
    <meta name="description" content="Formula 1 fixtures, circuit maps, full race results, fastest laps and World Drivers’ and Constructors’ Championship standings.">
    <style>
        :root {
            color-scheme: light;
            --sky-1: #e8fbff;
            --sky-2: #b6edf8;
            --sky-3: #72cfe4;
            --text: #11323f;
            --muted: #4f6d79;
            --brand: #0d4253;
            --brand-soft: #0f5a6d;
            --surface-1: rgba(255, 255, 255, 0.5);
            --surface-2: rgba(255, 255, 255, 0.26);
            --surface-3: rgba(255, 255, 255, 0.08);
            --surface-4: rgba(255, 255, 255, 0.05);
            --line: rgba(255, 255, 255, 0.94);
            --glow: rgba(255, 255, 255, 0.98);
            --shadow: 0 28px 72px rgba(16, 69, 88, 0.24);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --sky-1: #0b2030;
            --sky-2: #102f40;
            --sky-3: #154c61;
            --text: #eaf7fb;
            --muted: #a9c0cb;
            --brand: #e8fbff;
            --brand-soft: #8cd7ea;
            --surface-1: rgba(10, 24, 33, 0.74);
            --surface-2: rgba(8, 19, 27, 0.42);
            --surface-3: rgba(7, 18, 25, 0.22);
            --surface-4: rgba(7, 18, 25, 0.1);
            --line: rgba(188, 235, 248, 0.18);
            --glow: rgba(255, 255, 255, 0.12);
            --shadow: 0 30px 72px rgba(0, 0, 0, 0.34);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.95) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.72) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.88) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.58) 0 4%, transparent 5%),
                linear-gradient(180deg, #f0fdff 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
            overflow-x: hidden;
        }

        :root[data-theme="dark"] body {
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.05) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.03) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.04) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.02) 0 4%, transparent 5%),
                linear-gradient(180deg, #06131b 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.22) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.16) 100%),
                radial-gradient(circle at 18% 82%, rgba(255, 255, 255, 0.16), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            mix-blend-mode: screen;
        }

        :root[data-theme="dark"] body::before {
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.08) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.03) 100%),
                radial-gradient(circle at 18% 82%, rgba(72, 177, 210, 0.12), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.05), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        }

        .page {
            width: min(1200px, calc(100% - 24px));
            margin: 0 auto;
            padding: 20px 0 28px;
        }

        .frame {
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-2)),
                var(--surface-3);
            box-shadow:
                inset 0 1px 0 var(--glow),
                var(--shadow);
            backdrop-filter: blur(28px);
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .frame::before {
            width: 360px;
            height: 360px;
            top: -130px;
            right: -120px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.02) 72%);
        }

        .frame::after {
            width: 300px;
            height: 300px;
            left: -130px;
            bottom: -130px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.02) 72%);
        }

        .masthead {
            position: relative;
            z-index: 1;
            padding: 22px 24px 0;
        }

        .site-banner {
            margin-bottom: 18px;
            padding: 18px 22px;
            border-radius: 26px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 14px 26px rgba(23, 88, 111, 0.12);
            text-align: center;
            backdrop-filter: blur(30px);
        }

        .site-banner h1 {
            margin: 0;
            max-width: none;
            font-size: clamp(2.2rem, 5vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--brand);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .site-banner h1 img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        :root[data-theme="dark"] .site-banner h1 img {
            content: url("favicon-dark.svg");
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
            transition: transform 0.2s ease;
        }

        .nav a:hover { transform: translateY(-1px); }

        .nav a[aria-current="page"] {
            background: #2e7dd2c9;
            color: #fff;
            border-color: #2e7dd2c9;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
        }

        .theme-toggle:hover { transform: translateY(-1px); }

        .hero {
            position: relative;
            z-index: 1;
            padding: 24px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.95fr);
            gap: 14px;
            align-items: stretch;
        }

        .top-story {
            padding: 28px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #000000;
        }

        :root[data-theme="dark"] .eyebrow {
            color: #ffffff;
        }

        .top-story h2 {
            margin: 18px 0 12px;
            max-width: 12ch;
            font-size: clamp(3rem, 8vw, 6.4rem);
            line-height: 0.88;
            letter-spacing: -0.07em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
            color: var(--brand);
        }

        .lead {
            margin: 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.84;
        }

        .ladder-card {
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .fixtures-card {
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .fixtures-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .fixtures-card__head h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            color: var(--brand);
        }

        .round-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-selector__btn {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 6px 12px rgba(30, 86, 109, 0.08);
            backdrop-filter: blur(24px);
            transition: transform 0.15s ease;
            padding: 0;
            line-height: 1;
        }

        .round-selector__btn:hover { transform: translateY(-1px); }

        .round-selector__display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-width: 76px;
        }

        .round-selector__label {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            text-align: center;
            line-height: 1.15;
        }

        .round-selector__value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--brand);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .round-slider {
            width: 100%;
            margin: 4px 0 16px;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 999px;
            background:
                linear-gradient(90deg, var(--brand-soft) var(--fill, 0%), var(--surface-3) var(--fill, 0%));
            outline: none;
            cursor: pointer;
        }

        .round-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: var(--brand);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(14, 68, 88, 0.3);
            cursor: pointer;
        }

        .round-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: var(--brand);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(14, 68, 88, 0.3);
            cursor: pointer;
        }

        .round-slider::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: var(--surface-3);
        }

        .fixtures-list {
            display: grid;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .fixture {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px 14px;
            align-items: center;
            padding: 13px 14px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 24%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 14%, transparent)),
                rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
            min-width: 0;
        }

        .fixture__team {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .fixture__team--away {
            text-align: right;
            justify-content: flex-end;
        }

        .fixture__logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.42),
                0 0 4px rgba(0, 0, 0, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 14px rgba(14, 68, 88, 0.14);
            flex-shrink: 0;
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(
                    135deg,
                    var(--logo-from, #79d7ec) 0%,
                    var(--logo-from, #79d7ec) 62%,
                    var(--logo-mid, var(--logo-to, #0f5a6d)) 84%,
                    var(--logo-to, #0f5a6d) 100%
                );
        }

        .fixture__name {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--brand);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fixture__score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--brand);
            white-space: nowrap;
        }

        .fixture__vs {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-soft);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .fixture__meta {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .fixture__meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .fixture__status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.32);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.7rem;
        }

        .fixture__status--scheduled {
            background: rgb(255, 255, 255);
            border-color: rgba(13, 66, 83, 0.18);
            color: var(--brand-soft);
        }

        .fixture__status--finished {
            background: rgb(192, 232, 253);
            border-color: rgba(13, 66, 83, 0.18);
            color: var(--brand-soft);
        }

        :root[data-theme="dark"] .fixture__status--scheduled {
            background: rgb(0, 0, 0);
            border-color: rgba(255, 255, 255, 0.22);
        }

        :root[data-theme="dark"] .fixture__status--finished {
            background: rgb(23, 64, 95);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .fixtures-empty {
            text-align: center;
            padding: 28px 14px;
            color: var(--muted);
            font-weight: 700;
        }

        .fixtures-note {
            margin: 14px 0 0;
            padding: 9px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px dashed rgba(255, 255, 255, 0.5);
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.45;
        }

        .ladder-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ladder-card__head h2 {
            margin: 0;
            font-size: 1.42rem;
            letter-spacing: -0.03em;
            color: var(--brand);
        }

        .ladder-card__head span {
            color: var(--brand-soft);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .tab-group {
            display: flex;
            gap: 6px;
        }

        .tab {
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 6px 12px rgba(30, 86, 109, 0.08);
            backdrop-filter: blur(24px);
            transition: transform 0.15s ease;
        }

        .tab:hover { transform: translateY(-1px); }

        .tab--active {
            background: #2e7dd2c9;
            color: #fff;
            border-color: #2e7dd2c9;
        }

        .ladder-list {
            display: grid;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .ladder-row {
            display: grid;
            grid-template-columns: 24px 34px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 11px 12px;
            border-radius: 18px;
            min-width: 0;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 24%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 14%, transparent)),
                rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .ladder-row__pos {
            color: var(--brand-soft);
            font-weight: 800;
            text-align: center;
        }

        .ladder-row__team {
            color: var(--brand);
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ladder-row__logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.42),
                0 0 4px rgba(0, 0, 0, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 14px rgba(14, 68, 88, 0.14);
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(
                    135deg,
                    var(--logo-from, #79d7ec) 0%,
                    var(--logo-from, #79d7ec) 62%,
                    var(--logo-mid, var(--logo-to, #0f5a6d)) 84%,
                    var(--logo-to, #0f5a6d) 100%
                );
        }

        .ladder-row__stats {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            text-align: right;
        }

        .ladder-note {
            margin: 14px 0 0;
            color: var(--brand-soft);
            font-size: 0.88rem;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .top-story h2 {
                max-width: none;
            }
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 14px, 1200px);
                padding: 8px 0 16px;
            }

            .frame { border-radius: 24px; }

            .masthead,
            .hero {
                padding-left: 14px;
                padding-right: 14px;
            }

            .site-banner { padding: 16px; }

            .topbar {
                display: grid;
                justify-content: initial;
            }

            .topbar-actions { width: 100%; }

            .ladder-list { max-height: 420px; }

            .ladder-row {
                grid-template-columns: 20px 30px 1fr;
                gap: 6px;
                padding: 9px 10px;
            }

            .ladder-row__pos { font-size: 0.85rem; }

            .ladder-row__logo {
                width: 30px;
                height: 30px;
                font-size: 0.65rem;
            }

            .ladder-row__stats { display: none; }
        }
    </style>
    <link rel="stylesheet" href="f1.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg" id="favicon">
