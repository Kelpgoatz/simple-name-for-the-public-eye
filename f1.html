<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Drivers Championship</title>
    <style>
        :root {
            color-scheme: light;
            --sky-1: #e8fbff;
            --sky-2: #b6edf8;
            --sky-3: #72cfe4;
            --text: #11323f;
            --muted: #4f6d79;
            --brand: #0d4253;
            --brand-soft: #0f5a6d;
            --surface-1: rgba(255, 255, 255, 0.5);
            --surface-2: rgba(255, 255, 255, 0.26);
            --surface-3: rgba(255, 255, 255, 0.08);
            --surface-4: rgba(255, 255, 255, 0.05);
            --line: rgba(255, 255, 255, 0.94);
            --glow: rgba(255, 255, 255, 0.98);
            --shadow: 0 28px 72px rgba(16, 69, 88, 0.24);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --sky-1: #0b2030;
            --sky-2: #102f40;
            --sky-3: #154c61;
            --text: #eaf7fb;
            --muted: #a9c0cb;
            --brand: #e8fbff;
            --brand-soft: #8cd7ea;
            --surface-1: rgba(10, 24, 33, 0.74);
            --surface-2: rgba(8, 19, 27, 0.42);
            --surface-3: rgba(7, 18, 25, 0.22);
            --surface-4: rgba(7, 18, 25, 0.1);
            --line: rgba(188, 235, 248, 0.18);
            --glow: rgba(255, 255, 255, 0.12);
            --shadow: 0 30px 72px rgba(0, 0, 0, 0.34);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.95) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.72) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.88) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.58) 0 4%, transparent 5%),
                linear-gradient(180deg, #f0fdff 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
            overflow-x: hidden;
        }

        :root[data-theme="dark"] body {
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.05) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.03) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.04) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.02) 0 4%, transparent 5%),
                linear-gradient(180deg, #06131b 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.22) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.16) 100%),
                radial-gradient(circle at 18% 82%, rgba(255, 255, 255, 0.16), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            mix-blend-mode: screen;
        }

        :root[data-theme="dark"] body::before {
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.08) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.03) 100%),
                radial-gradient(circle at 18% 82%, rgba(72, 177, 210, 0.12), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.05), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        }

        .page {
            width: min(1200px, calc(100% - 24px));
            margin: 0 auto;
            padding: 20px 0 28px;
        }

        .frame {
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-2)),
                var(--surface-3);
            box-shadow:
                inset 0 1px 0 var(--glow),
                var(--shadow);
            backdrop-filter: blur(28px);
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .frame::before {
            width: 360px;
            height: 360px;
            top: -130px;
            right: -120px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.02) 72%);
        }

        .frame::after {
            width: 300px;
            height: 300px;
            left: -130px;
            bottom: -130px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.02) 72%);
        }

        .masthead {
            position: relative;
            z-index: 1;
            padding: 22px 24px 0;
        }

        .site-banner {
            margin-bottom: 18px;
            padding: 18px 22px;
            border-radius: 26px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 14px 26px rgba(23, 88, 111, 0.12);
            text-align: center;
            backdrop-filter: blur(30px);
        }

        .site-banner h1 {
            margin: 0;
            max-width: none;
            font-size: clamp(2.2rem, 5vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--brand);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .site-banner h1 img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        :root[data-theme="dark"] .site-banner h1 img {
            content: url("favicon-dark.png");
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
            transition: transform 0.2s ease;
        }

        .nav a:hover { transform: translateY(-1px); }

        .nav a[aria-current="page"] {
            background: #2e7dd2c9;
            color: #fff;
            border-color: #2e7dd2c9;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
        }

        .theme-toggle:hover { transform: translateY(-1px); }

        .hero {
            position: relative;
            z-index: 1;
            padding: 24px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.95fr);
            gap: 14px;
            align-items: stretch;
        }

        .top-story {
            padding: 28px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #000000;
        }

        :root[data-theme="dark"] .eyebrow {
            color: #ffffff;
        }

        .top-story h2 {
            margin: 18px 0 12px;
            max-width: 12ch;
            font-size: clamp(3rem, 8vw, 6.4rem);
            line-height: 0.88;
            letter-spacing: -0.07em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
            color: var(--brand);
        }

        .lead {
            margin: 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.84;
        }

        .ladder-card {
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .ladder-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ladder-card__head h2 {
            margin: 0;
            font-size: 1.42rem;
            letter-spacing: -0.03em;
            color: var(--brand);
        }

        .ladder-card__head span {
            color: var(--brand-soft);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .tab-group {
            display: flex;
            gap: 6px;
        }

        .tab {
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 6px 12px rgba(30, 86, 109, 0.08);
            backdrop-filter: blur(24px);
            transition: transform 0.15s ease;
        }

        .tab:hover { transform: translateY(-1px); }

        .tab--active {
            background: #2e7dd2c9;
            color: #fff;
            border-color: #2e7dd2c9;
        }

        .ladder-list {
            display: grid;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .ladder-row {
            display: grid;
            grid-template-columns: 24px 34px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 11px 12px;
            border-radius: 18px;
            min-width: 0;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 24%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 14%, transparent)),
                rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .ladder-row__pos {
            color: var(--brand-soft);
            font-weight: 800;
            text-align: center;
        }

        .ladder-row__team {
            color: var(--brand);
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ladder-row__logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.42),
                0 0 4px rgba(0, 0, 0, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 14px rgba(14, 68, 88, 0.14);
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(
                    135deg,
                    var(--logo-from, #79d7ec) 0%,
                    var(--logo-from, #79d7ec) 62%,
                    var(--logo-mid, var(--logo-to, #0f5a6d)) 84%,
                    var(--logo-to, #0f5a6d) 100%
                );
        }

        .ladder-row__stats {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            text-align: right;
        }

        .ladder-note {
            margin: 14px 0 0;
            color: var(--brand-soft);
            font-size: 0.88rem;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .top-story h2 {
                max-width: none;
            }
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 14px, 1200px);
                padding: 8px 0 16px;
            }

            .frame { border-radius: 24px; }

            .masthead,
            .hero {
                padding-left: 14px;
                padding-right: 14px;
            }

            .site-banner { padding: 16px; }

            .topbar {
                display: grid;
                justify-content: initial;
            }

            .topbar-actions { width: 100%; }

            .ladder-list { max-height: 420px; }

            .ladder-row {
                grid-template-columns: 20px 30px 1fr;
                gap: 6px;
                padding: 9px 10px;
            }

            .ladder-row__pos { font-size: 0.85rem; }

            .ladder-row__logo {
                width: 30px;
                height: 30px;
                font-size: 0.65rem;
            }

            .ladder-row__stats { display: none; }
        }
    </style>
    <link rel="icon" href="favicon.png" id="favicon">
</head>
<body id="top">
    <main class="page">
        <div class="frame">
            <header class="masthead">
                <div class="site-banner">
                    <h1><img src="favicon.png" alt="" width="64" height="64"></h1>
                </div>
                <div class="topbar">
                    <nav class="nav" aria-label="Primary">
                            <a href="index.html">Home</a>
                            <a href="f1.html" aria-current="page">F1</a>
                            <a href="afl.html">AFL</a>
                        </nav>
                    <div class="topbar-actions">
                        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">Dark mode</button>
                    </div>
                </div>
            </header>

            <section class="hero">
                <div class="hero-grid">
                    <div class="top-story">
                        <span class="eyebrow">Formula 1</span>
                        <h2>F1 Drivers Championship</h2>
                        <p class="lead">
                            Live drivers championship standings for the <span data-ladder-season>2026</span> season.
                            Updated every hour via the F1 API.
                        </p>
                    </div>
                    <aside class="ladder-card" aria-labelledby="f1-ladder-title">
                        <div class="ladder-card__head">
                            <div class="tab-group" role="tablist">
                                <button class="tab tab--active" role="tab" aria-selected="true" data-tab="drivers">WDC</button>
                                <button class="tab" role="tab" aria-selected="false" data-tab="constructors">WCC</button>
                            </div>
                            <span data-ladder-season>2026</span>
                        </div>
                        <div class="ladder-list" data-ladder-list>
                            <div class="ladder-row" style="--logo-from:#00d2be;--logo-to:#000000;">
                                <div class="ladder-row__pos">1</div>
                                <div class="ladder-row__logo" aria-hidden="true">12</div>
                                <div class="ladder-row__team">Andrea Kimi Antonelli</div>
                                <div class="ladder-row__stats">179 pts · 5 wins</div>
                            </div>
                        </div>
                        <p class="ladder-note" data-ladder-note></p>
                    </aside>
                </div>
            </section>
        </div>
    </main>
    <script>
        (() => {
            const ladderList = document.querySelector("[data-ladder-list]");
            const ladderNote = document.querySelector("[data-ladder-note]");
            const seasonEl = document.querySelectorAll("[data-ladder-season]");
            const tabs = document.querySelectorAll("[data-tab]");

            if (!ladderList) return;

            const teams = {
                mercedes: { display: "Mercedes", abbr: "MER", colors: ["#00d2be", "#000000"] },
                ferrari: { display: "Ferrari", abbr: "FER", colors: ["#dc0000", "#fff200"] },
                red_bull: { display: "Red Bull Racing", abbr: "RBR", colors: ["#1e41a0", "#e31b23"] },
                mclaren: { display: "McLaren", abbr: "MCL", colors: ["#ff8700", "#000000"] },
                alpine: { display: "Alpine", abbr: "ALP", colors: ["#0090ff", "#000000"] },
                rb: { display: "Racing Bulls", abbr: "RB", colors: ["#e31b23", "#1e41a0"] },
                haas: { display: "Haas", abbr: "HAA", colors: ["#ffffff", "#e31b23"] },
                audi: { display: "Audi", abbr: "AUD", colors: ["#dc0000", "#000000"] },
                williams: { display: "Williams", abbr: "WIL", colors: ["#005aff", "#ffffff"] },
                aston_martin: { display: "Aston Martin", abbr: "AST", colors: ["#006f62", "#000000"] },
                cadillac: { display: "Cadillac", abbr: "CAD", colors: ["#111111", "#666666"] }
            };

            const fallbackDrivers = [
                { position: 1, points: 179, wins: 5, driver: { name: "Andrea", surname: "Kimi Antonelli", number: 12 }, teamId: "mercedes" },
                { position: 2, points: 154, wins: 2, driver: { name: "George", surname: "Russell", number: 63 }, teamId: "mercedes" },
                { position: 3, points: 147, wins: 1, driver: { name: "Lewis", surname: "Hamilton", number: 44 }, teamId: "ferrari" },
                { position: 4, points: 108, wins: 1, driver: { name: "Charles", surname: "Leclerc", number: 16 }, teamId: "ferrari" },
                { position: 5, points: 97, wins: 0, driver: { name: "Lando", surname: "Norris", number: 4 }, teamId: "mclaren" },
                { position: 6, points: 82, wins: 0, driver: { name: "Oscar", surname: "Piastri", number: 81 }, teamId: "mclaren" },
                { position: 7, points: 76, wins: 0, driver: { name: "Max", surname: "Verstappen", number: 33 }, teamId: "red_bull" },
                { position: 8, points: 52, wins: 0, driver: { name: "Isack", surname: "Hadjar", number: 6 }, teamId: "red_bull" },
                { position: 9, points: 42, wins: 0, driver: { name: "Pierre", surname: "Gasly", number: 10 }, teamId: "alpine" },
                { position: 10, points: 39, wins: 0, driver: { name: "Liam", surname: "Lawson", number: 30 }, teamId: "rb" },
                { position: 11, points: 20, wins: 0, driver: { name: "Arvid", surname: "Lindblad", number: 36 }, teamId: "rb" },
                { position: 12, points: 18, wins: 0, driver: { name: "Oliver", surname: "Bearman", number: 87 }, teamId: "haas" },
                { position: 13, points: 18, wins: 0, driver: { name: "Franco", surname: "Colapinto", number: 43 }, teamId: "alpine" },
                { position: 14, points: 6, wins: 0, driver: { name: "Gabriel", surname: "Bortoleto", number: 5 }, teamId: "audi" },
                { position: 15, points: 6, wins: 0, driver: { name: "Carlos", surname: "Sainz", number: 55 }, teamId: "williams" },
                { position: 16, points: 5, wins: 0, driver: { name: "Alex", surname: "Albon", number: 23 }, teamId: "williams" },
                { position: 17, points: 3, wins: 0, driver: { name: "Esteban", surname: "Ocon", number: 31 }, teamId: "haas" },
                { position: 18, points: 1, wins: 0, driver: { name: "Fernando", surname: "Alonso", number: 14 }, teamId: "aston_martin" },
                { position: 19, points: 0, wins: 0, driver: { name: "Nico", surname: "Hulkenberg", number: 27 }, teamId: "audi" },
                { position: 20, points: 0, wins: 0, driver: { name: "Valtteri", surname: "Bottas", number: 77 }, teamId: "cadillac" },
                { position: 21, points: 0, wins: 0, driver: { name: "Sergio", surname: "Pérez", number: 11 }, teamId: "cadillac" },
                { position: 22, points: 0, wins: 0, driver: { name: "Lance", surname: "Stroll", number: 18 }, teamId: "aston_martin" }
            ];

            const fallbackConstructors = [
                { position: 1, teamId: "mercedes", points: 333, wins: 7 },
                { position: 2, teamId: "ferrari", points: 255, wins: 2 },
                { position: 3, teamId: "mclaren", points: 179, wins: 0 },
                { position: 4, teamId: "red_bull", points: 128, wins: 0 },
                { position: 5, teamId: "alpine", points: 60, wins: 0 },
                { position: 6, teamId: "rb", points: 59, wins: 0 },
                { position: 7, teamId: "haas", points: 21, wins: 0 },
                { position: 8, teamId: "williams", points: 11, wins: 0 },
                { position: 9, teamId: "audi", points: 6, wins: 0 },
                { position: 10, teamId: "aston_martin", points: 1, wins: 0 },
                { position: 11, teamId: "cadillac", points: 0, wins: 0 }
            ];

            let currentTab = "drivers";
            let driversData = null;
            let constructorsData = null;

            const formatNumber = (value, fallback = 0) => {
                const number = Number(value);
                return Number.isFinite(number) ? number : fallback;
            };

            const addText = (className, text, parent) => {
                const element = document.createElement("div");
                element.className = className;
                element.textContent = text;
                parent.appendChild(element);
                return element;
            };

            const applyColors = (row, colors) => {
                row.style.setProperty("--logo-from", colors[0]);
                row.style.setProperty("--logo-to", colors[colors.length - 1]);
                if (colors.length > 2) {
                    row.style.setProperty("--logo-mid", colors[1]);
                } else {
                    row.style.removeProperty("--logo-mid");
                }
            };

            const renderDrivers = (data, sourceText) => {
                const standings = data.drivers_championship || data;
                const sorted = [...standings].sort((a, b) => formatNumber(a.position) - formatNumber(b.position));
                ladderList.replaceChildren();

                sorted.forEach((standing) => {
                    const team = teams[standing.teamId] || { display: standing.teamId, abbr: "", colors: ["#0f5a6d", "#79d7ec"] };
                    const driverName = `${standing.driver.name} ${standing.driver.surname}`;
                    const driverNumber = String(standing.driver.number || "");

                    const row = document.createElement("div");
                    row.className = "ladder-row";
                    applyColors(row, team.colors);

                    addText("ladder-row__pos", String(formatNumber(standing.position)), row);
                    const logo = addText("ladder-row__logo", driverNumber, row);
                    logo.setAttribute("aria-hidden", "true");
                    addText("ladder-row__team", driverName, row);
                    addText("ladder-row__stats", `${formatNumber(standing.points)} pts · ${formatNumber(standing.wins)} wins`, row);

                    ladderList.appendChild(row);
                });

                if (ladderNote) ladderNote.textContent = sourceText;
            };

            const renderConstructors = (data, sourceText) => {
                const standings = data.constructors_championship || data;
                const sorted = [...standings].sort((a, b) => formatNumber(a.position) - formatNumber(b.position));
                ladderList.replaceChildren();

                sorted.forEach((standing) => {
                    const team = teams[standing.teamId] || { display: standing.teamId, abbr: "", colors: ["#0f5a6d", "#79d7ec"] };

                    const row = document.createElement("div");
                    row.className = "ladder-row";
                    applyColors(row, team.colors);

                    addText("ladder-row__pos", String(formatNumber(standing.position)), row);
                    const logo = addText("ladder-row__logo", team.abbr, row);
                    logo.setAttribute("aria-hidden", "true");
                    addText("ladder-row__team", team.display, row);
                    addText("ladder-row__stats", `${formatNumber(standing.points)} pts · ${formatNumber(standing.wins)} wins`, row);

                    ladderList.appendChild(row);
                });

                if (ladderNote) ladderNote.textContent = sourceText;
            };

            const switchTab = (tab) => {
                currentTab = tab;
                tabs.forEach((t) => {
                    const isActive = t.getAttribute("data-tab") === tab;
                    t.classList.toggle("tab--active", isActive);
                    t.setAttribute("aria-selected", String(isActive));
                });

                if (tab === "drivers") {
                    if (driversData) {
                        renderDrivers(driversData, "Standings updated every hour via F1 API.");
                    } else {
                        renderDrivers(fallbackDrivers, "Standings may not reflect most recent results.");
                    }
                } else {
                    if (constructorsData) {
                        renderConstructors(constructorsData, "Standings updated every hour via F1 API.");
                    } else {
                        renderConstructors(fallbackConstructors, "Standings may not reflect most recent results.");
                    }
                }
            };

            seasonEl.forEach((el) => { el.textContent = new Date().getFullYear(); });

            tabs.forEach((tab) => {
                tab.addEventListener("click", () => {
                    switchTab(tab.getAttribute("data-tab"));
                });
            });

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("tab") === "constructors") {
                switchTab("constructors");
            } else {
                renderDrivers(fallbackDrivers, "Standings updated every hour via F1 API.");
            }

            fetch("drivers-championship.json")
                .then((response) => {
                    if (!response.ok) throw new Error("Failed to load");
                    return response.json();
                })
                .then((data) => {
                    if (!data.drivers_championship || !Array.isArray(data.drivers_championship)) throw new Error("Invalid");
                    driversData = data;
                    if (currentTab === "drivers") {
                        renderDrivers(data, "Standings updated every hour via F1 API.");
                    }
                })
                .catch(() => {});

            fetch("constructors-championship.json")
                .then((response) => {
                    if (!response.ok) throw new Error("Failed to load");
                    return response.json();
                })
                .then((data) => {
                    if (!data.constructors_championship || !Array.isArray(data.constructors_championship)) throw new Error("Invalid");
                    constructorsData = data;
                    if (currentTab === "constructors") {
                        renderConstructors(data, "Standings updated every hour via F1 API.");
                    }
                })
                .catch(() => {});
        })();

        (() => {
            const storageKey = "cgrillo-theme";
            const root = document.documentElement;
            const toggleButton = document.querySelector("[data-theme-toggle]");

            const getStoredTheme = () => {
                try { return localStorage.getItem(storageKey); }
                catch { return null; }
            };

            const setTheme = (theme, persist = true) => {
                root.dataset.theme = theme;
                if (toggleButton) {
                    toggleButton.textContent = theme === "dark" ? "Light mode" : "Dark mode";
                    toggleButton.setAttribute("aria-pressed", String(theme === "dark"));
                }
                const favicon = document.getElementById("favicon");
                if (favicon) favicon.href = theme === "dark" ? "favicon-dark.png" : "favicon.png";
                if (persist) {
                    try { localStorage.setItem(storageKey, theme); }
                    catch { }
                }
            };

            const initialTheme = getStoredTheme() || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            setTheme(initialTheme, false);

            toggleButton?.addEventListener("click", () => {
                setTheme(root.dataset.theme === "dark" ? "light" : "dark");
            });
        })();
    </script>
</body>
</html>
