<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFL Ladder</title>
    <style>
        :root {
            color-scheme: light;
            --sky-1: #e8fbff;
            --sky-2: #b6edf8;
            --sky-3: #72cfe4;
            --text: #11323f;
            --muted: #4f6d79;
            --brand: #0d4253;
            --brand-soft: #0f5a6d;
            --surface-1: rgba(255, 255, 255, 0.5);
            --surface-2: rgba(255, 255, 255, 0.26);
            --surface-3: rgba(255, 255, 255, 0.08);
            --surface-4: rgba(255, 255, 255, 0.05);
            --line: rgba(255, 255, 255, 0.94);
            --glow: rgba(255, 255, 255, 0.98);
            --shadow: 0 28px 72px rgba(16, 69, 88, 0.24);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --sky-1: #0b2030;
            --sky-2: #102f40;
            --sky-3: #154c61;
            --text: #eaf7fb;
            --muted: #a9c0cb;
            --brand: #e8fbff;
            --brand-soft: #8cd7ea;
            --surface-1: rgba(10, 24, 33, 0.74);
            --surface-2: rgba(8, 19, 27, 0.42);
            --surface-3: rgba(7, 18, 25, 0.22);
            --surface-4: rgba(7, 18, 25, 0.1);
            --line: rgba(188, 235, 248, 0.18);
            --glow: rgba(255, 255, 255, 0.12);
            --shadow: 0 30px 72px rgba(0, 0, 0, 0.34);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.95) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.72) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.88) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.58) 0 4%, transparent 5%),
                linear-gradient(180deg, #f0fdff 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
            overflow-x: hidden;
        }

        :root[data-theme="dark"] body {
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.05) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.03) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.04) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.02) 0 4%, transparent 5%),
                linear-gradient(180deg, #06131b 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.22) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.16) 100%),
                radial-gradient(circle at 18% 82%, rgba(255, 255, 255, 0.16), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            mix-blend-mode: screen;
        }

        :root[data-theme="dark"] body::before {
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.08) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.03) 100%),
                radial-gradient(circle at 18% 82%, rgba(72, 177, 210, 0.12), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.05), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        }

        .page {
            width: min(1200px, calc(100% - 24px));
            margin: 0 auto;
            padding: 20px 0 28px;
        }

        .frame {
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-2)),
                var(--surface-3);
            box-shadow:
                inset 0 1px 0 var(--glow),
                var(--shadow);
            backdrop-filter: blur(28px);
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .frame::before {
            width: 360px;
            height: 360px;
            top: -130px;
            right: -120px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.02) 72%);
        }

        .frame::after {
            width: 300px;
            height: 300px;
            left: -130px;
            bottom: -130px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.02) 72%);
        }

        .masthead {
            position: relative;
            z-index: 1;
            padding: 22px 24px 0;
        }

        .site-banner {
            margin-bottom: 18px;
            padding: 18px 22px;
            border-radius: 26px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 14px 26px rgba(23, 88, 111, 0.12);
            text-align: center;
            backdrop-filter: blur(30px);
        }

        .site-banner h1 {
            margin: 0;
            max-width: none;
            font-size: clamp(2.2rem, 5vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--brand);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .site-banner h1 img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        :root[data-theme="dark"] .site-banner h1 img {
            content: url("favicon-dark.png");
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
            transition: transform 0.2s ease;
        }

        .nav a:hover { transform: translateY(-1px); }

        .nav a[aria-current="page"] {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
        }

        .theme-toggle:hover { transform: translateY(-1px); }

        .hero {
            position: relative;
            z-index: 1;
            padding: 24px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.95fr);
            gap: 14px;
            align-items: stretch;
        }

        .top-story {
            padding: 28px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(214, 247, 255, 0.36));
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: inset 0 1px 0 var(--glow);
            color: var(--brand-soft);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .top-story h2 {
            margin: 18px 0 12px;
            max-width: 12ch;
            font-size: clamp(3rem, 8vw, 6.4rem);
            line-height: 0.88;
            letter-spacing: -0.07em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
            color: var(--brand);
        }

        .lead {
            margin: 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.84;
        }

        .ladder-card {
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .ladder-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ladder-card__head h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            color: var(--brand);
        }

        .ladder-list {
            display: grid;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .ladder-row {
            display: grid;
            grid-template-columns: 24px 34px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 11px 12px;
            border-radius: 18px;
            min-width: 0;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 24%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 14%, transparent)),
                rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .ladder-row__pos {
            color: var(--brand-soft);
            font-weight: 800;
            text-align: center;
        }

        .ladder-row__team {
            color: var(--brand);
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ladder-row__logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.42),
                0 0 4px rgba(0, 0, 0, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 14px rgba(14, 68, 88, 0.14);
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(
                    135deg,
                    var(--logo-from, #79d7ec) 0%,
                    var(--logo-from, #79d7ec) 62%,
                    var(--logo-mid, var(--logo-to, #0f5a6d)) 84%,
                    var(--logo-to, #0f5a6d) 100%
                );
        }

        .ladder-row__stats {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            text-align: right;
        }

        .ladder-note {
            margin: 14px 0 0;
            color: var(--brand-soft);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .fixtures-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        .round-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-arrow {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 6px 12px rgba(30, 86, 109, 0.08);
            backdrop-filter: blur(24px);
            transition: transform 0.15s ease;
            padding: 0;
            line-height: 1;
        }

        .round-arrow:hover { transform: translateY(-1px); }

        .round-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 44px;
        }

        .round-display__num {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brand);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .round-display__dots {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .round-display__dots span {
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: var(--brand-soft);
            opacity: 0.25;
            transition: opacity 0.2s ease;
        }

        .round-display__dots span.active {
            opacity: 1;
            background: var(--brand);
        }

        .fixtures-list {
            display: grid;
            gap: 10px;
        }

        .match-card {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px 16px;
            align-items: center;
            padding: 14px 16px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 18%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 10%, transparent)),
                rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
            min-width: 0;
        }

        .match-card__team {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .match-card__team--away {
            text-align: right;
            justify-content: flex-end;
        }

        .match-card__logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.62rem;
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.42);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(135deg, var(--logo-from, #79d7ec) 0%, var(--logo-to, #0f5a6d) 100%);
        }

        .match-card__name {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--brand);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .match-card__score {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--brand);
        }

        .match-card__score-value--winner {
            color: var(--brand);
        }

        .match-card__score-value--loser {
            color: var(--muted);
        }

        .match-card__vs {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-soft);
            text-transform: uppercase;
        }

        .match-card__meta {
            grid-column: 1 / -1;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
        }

        .fixtures-empty {
            text-align: center;
            padding: 28px 14px;
            color: var(--muted);
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .top-story h2 {
                max-width: none;
            }
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 14px, 1200px);
                padding: 8px 0 16px;
            }

            .frame { border-radius: 24px; }

            .masthead,
            .hero {
                padding-left: 14px;
                padding-right: 14px;
            }

            .site-banner { padding: 16px; }

            .topbar {
                display: grid;
                justify-content: initial;
            }

            .topbar-actions { width: 100%; }

            .ladder-list { max-height: 420px; }

            .ladder-row {
                grid-template-columns: 20px 30px 1fr;
                gap: 6px;
                padding: 9px 10px;
            }

            .ladder-row__pos { font-size: 0.85rem; }

            .ladder-row__logo {
                width: 30px;
                height: 30px;
                font-size: 0.65rem;
            }

            .ladder-row__stats { display: none; }

            .fixtures-head {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .round-nav {
                justify-content: center;
            }

            .match-card {
                grid-template-columns: 1fr auto 1fr;
                gap: 6px 10px;
                padding: 12px;
            }

            .match-card__logo {
                width: 24px;
                height: 24px;
                font-size: 0.55rem;
            }

            .match-card__name {
                font-size: 0.8rem;
            }

            .match-card__score {
                font-size: 0.95rem;
                gap: 4px;
            }
        }
    </style>
    <link rel="icon" href="favicon.png" id="favicon">
</head>
<body id="top">
    <main class="page">
        <div class="frame">
            <header class="masthead">
                <div class="site-banner">
                    <h1><img src="favicon.png" alt="" width="64" height="64"></h1>
                </div>
                <div class="topbar">
                    <nav class="nav" aria-label="Primary">
                        <a href="index.html">Home</a>
                        <a href="f1.html">F1</a>
                        <a href="afl.html" aria-current="page">AFL</a>
                    </nav>
                    <div class="topbar-actions">
                        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">Dark mode</button>
                    </div>
                </div>
            </header>

            <section class="hero">
                <div class="hero-grid">
                    <div class="top-story">
                        <div class="fixtures-head">
                            <span class="eyebrow">Round</span>
                            <div class="round-nav">
                                <button class="round-arrow" data-round-prev aria-label="Previous round">&#9664;</button>
                                <div class="round-display">
                                    <span class="round-display__num" data-round-num>1</span>
                                    <div class="round-display__dots" data-round-dots></div>
                                </div>
                                <button class="round-arrow" data-round-next aria-label="Next round">&#9654;</button>
                            </div>
                        </div>
                        <div class="fixtures-list" data-fixtures-list>
                            <p class="lead">Select a round to view scores and fixtures.</p>
                        </div>
                    </div>
                    <aside class="ladder-card" aria-labelledby="afl-ladder-title">

                        </div>
                        <div class="ladder-list" data-ladder-list>

                            </div>
                        </div>
                        <p class="ladder-note" data-ladder-note></p>
                    </aside>
                </div>
            </section>
        </div>
    </main>
    <script>
        (() => {
            const ladderList = document.querySelector("[data-ladder-list]");
            const ladderNote = document.querySelector("[data-ladder-note]");

            if (!ladderList) return;

            const teams = {
                Adelaide: { display: "Adelaide Crows", initials: "AC", colors: ["#002b5c", "#e31b23", "#ffcc00"] },
                "Brisbane Lions": { display: "Brisbane Lions", initials: "BL", colors: ["#7a003c", "#0047bb", "#ffcc00"] },
                Carlton: { display: "Carlton", initials: "CA", colors: ["#002b5c", "#f7f8fb"] },
                Collingwood: { display: "Collingwood", initials: "CW", colors: ["#111111", "#f5f5f5"] },
                Essendon: { display: "Essendon", initials: "ES", colors: ["#111111", "#e31b23"] },
                Fremantle: { display: "Fremantle", initials: "FR", colors: ["#5a2ca0", "#f1ebff"] },
                Geelong: { display: "Geelong Cats", initials: "GC", colors: ["#002b5c", "#f4f7fb"] },
                "Gold Coast": { display: "Gold Coast Suns", initials: "GS", colors: ["#e31b23", "#ffd300"] },
                "Greater Western Sydney": { display: "GWS Giants", initials: "GW", colors: ["#ff6f00", "#3a3a3a", "#ffffff"] },
                Hawthorn: { display: "Hawthorn", initials: "HW", colors: ["#6b3f1d", "#ffcc00"] },
                Melbourne: { display: "Melbourne", initials: "ME", colors: ["#002b5c", "#e31b23"] },
                "North Melbourne": { display: "North Melbourne", initials: "NM", colors: ["#0047bb", "#f7f8fb"] },
                "Port Adelaide": { display: "Port Adelaide", initials: "PA", colors: ["#008c8c", "#111111", "#c0c0c0"] },
                Richmond: { display: "Richmond", initials: "RI", colors: ["#111111", "#fdd000"] },
                "St Kilda": { display: "St Kilda", initials: "ST", colors: ["#e31b23", "#f5f5f5", "#111111"] },
                Sydney: { display: "Sydney Swans", initials: "SS", colors: ["#e31b23", "#f7f7fb"] },
                "West Coast": { display: "West Coast Eagles", initials: "WC", colors: ["#0047bb", "#ffcc00"] },
                "Western Bulldogs": { display: "Western Bulldogs", initials: "WB", colors: ["#0047bb", "#e31b23", "#f7f7fb"] }
            };

            const teamByName = new Map(
                Object.entries(teams).map(([key, val]) => [val.display.toLowerCase(), key])
            );

            const fallbackStandings = [
                { rank: 1, name: "Fremantle", played: 16, wins: 14, losses: 2, draws: 0, pts: 56, percentage: 141.6, "for": 1579, against: 1115 },
                { rank: 2, name: "Sydney Swans", played: 16, wins: 13, losses: 3, draws: 0, pts: 52, percentage: 136.9, "for": 1751, against: 1279 },
                { rank: 3, name: "Hawthorn", played: 16, wins: 10, losses: 5, draws: 1, pts: 42, percentage: 110.0, "for": 1547, against: 1406 },
                { rank: 4, name: "Brisbane Lions", played: 16, wins: 10, losses: 6, draws: 0, pts: 40, percentage: 111.7, "for": 1674, against: 1498 },
                { rank: 5, name: "Adelaide Crows", played: 16, wins: 10, losses: 6, draws: 0, pts: 40, percentage: 111.4, "for": 1427, against: 1281 },
                { rank: 6, name: "Melbourne", played: 16, wins: 10, losses: 6, draws: 0, pts: 40, percentage: 106.3, "for": 1555, against: 1463 },
                { rank: 7, name: "Geelong Cats", played: 16, wins: 9, losses: 7, draws: 0, pts: 36, percentage: 117.1, "for": 1591, against: 1359 },
                { rank: 8, name: "Western Bulldogs", played: 16, wins: 9, losses: 7, draws: 0, pts: 36, percentage: 90.8, "for": 1325, against: 1459 },
                { rank: 9, name: "North Melbourne", played: 15, wins: 8, losses: 7, draws: 0, pts: 32, percentage: 92.2, "for": 1294, against: 1404 },
                { rank: 10, name: "Collingwood", played: 15, wins: 7, losses: 7, draws: 1, pts: 30, percentage: 104.2, "for": 1253, against: 1202 },
                { rank: 11, name: "Gold Coast SUNS", played: 15, wins: 7, losses: 8, draws: 0, pts: 28, percentage: 101.2, "for": 1359, against: 1343 },
                { rank: 12, name: "GWS GIANTS", played: 16, wins: 7, losses: 9, draws: 0, pts: 28, percentage: 100.8, "for": 1471, against: 1460 },
                { rank: 13, name: "Carlton", played: 15, wins: 7, losses: 8, draws: 0, pts: 28, percentage: 95.6, "for": 1254, against: 1312 },
                { rank: 14, name: "St Kilda", played: 15, wins: 6, losses: 9, draws: 0, pts: 24, percentage: 100.6, "for": 1334, against: 1326 },
                { rank: 15, name: "Port Adelaide", played: 15, wins: 5, losses: 10, draws: 0, pts: 20, percentage: 100.9, "for": 1222, against: 1211 },
                { rank: 16, name: "West Coast Eagles", played: 16, wins: 4, losses: 12, draws: 0, pts: 16, percentage: 71.5, "for": 1161, against: 1623 },
                { rank: 17, name: "Richmond", played: 15, wins: 2, losses: 13, draws: 0, pts: 8, percentage: 61.8, "for": 987, against: 1598 },
                { rank: 18, name: "Essendon", played: 15, wins: 1, losses: 14, draws: 0, pts: 4, percentage: 71.0, "for": 1092, against: 1537 }
            ];

            const formatNumber = (value, fallback = 0) => {
                const number = Number(value);
                return Number.isFinite(number) ? number : fallback;
            };

            const formatPercentage = (value) => formatNumber(value).toFixed(1);

            const addText = (className, text, parent) => {
                const element = document.createElement("div");
                element.className = className;
                element.textContent = text;
                parent.appendChild(element);
                return element;
            };

            const applyColors = (row, colors) => {
                row.style.setProperty("--logo-from", colors[0]);
                row.style.setProperty("--logo-to", colors[colors.length - 1]);
                if (colors.length > 2) {
                    row.style.setProperty("--logo-mid", colors[1]);
                } else {
                    row.style.removeProperty("--logo-mid");
                }
            };

            const renderStandings = (data, sourceText) => {
                const sortedStandings = [...data].sort((first, second) => formatNumber(first.rank) - formatNumber(second.rank));
                ladderList.replaceChildren();

                sortedStandings.forEach((standing, index) => {
                    const team = teams[teamByName.get(standing.name.toLowerCase())] || {
                        display: standing.name,
                        initials: standing.name.slice(0, 2).toUpperCase(),
                        colors: ["#0f5a6d", "#79d7ec"]
                    };
                    const row = document.createElement("div");
                    row.className = "ladder-row";
                    applyColors(row, team.colors);

                    addText("ladder-row__pos", String(formatNumber(standing.rank, index + 1)), row);
                    const logo = addText("ladder-row__logo", team.initials, row);
                    logo.setAttribute("aria-hidden", "true");
                    addText("ladder-row__team", team.display, row);

                    addText(
                        "ladder-row__stats",
                        `${formatNumber(standing.wins)}-${formatNumber(standing.losses)}-${formatNumber(standing.draws)} · ${formatNumber(standing.pts)} pts · ${formatPercentage(standing.percentage)}%`,
                        row
                    );

                    ladderList.appendChild(row);
                });

                if (ladderNote) {
                    ladderNote.textContent = sourceText;
                }
            };

            renderStandings(fallbackStandings, "Standings updated every 15 minutes via AFL API.");

            fetch("standings.json")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to load standings");
                    return response.json();
                })
                .then(data => {
                    if (!Array.isArray(data)) throw new Error("Invalid response");
                    renderStandings(data, "Standings updated every 15 minutes via AFL API.");
                })
                .catch(() => {
                    renderStandings(fallbackStandings, "Standings may not reflect most recent results.");
                });
        })();

        (() => {
            const fixturesList = document.querySelector("[data-fixtures-list]");
            const roundNum = document.querySelector("[data-round-num]");
            const roundDots = document.querySelector("[data-round-dots]");
            const prevBtn = document.querySelector("[data-round-prev]");
            const nextBtn = document.querySelector("[data-round-next]");

            const totalRounds = 24;
            let currentRound = 1;
            let fixturesData = null;

            const fixtureTeams = {
                Adelaide: { display: "Adelaide Crows", initials: "AC", colors: ["#002b5c", "#e31b23", "#ffcc00"] },
                "Brisbane Lions": { display: "Brisbane Lions", initials: "BL", colors: ["#7a003c", "#0047bb", "#ffcc00"] },
                Carlton: { display: "Carlton", initials: "CA", colors: ["#002b5c", "#f7f8fb"] },
                Collingwood: { display: "Collingwood", initials: "CW", colors: ["#111111", "#f5f5f5"] },
                Essendon: { display: "Essendon", initials: "ES", colors: ["#111111", "#e31b23"] },
                Fremantle: { display: "Fremantle", initials: "FR", colors: ["#5a2ca0", "#f1ebff"] },
                Geelong: { display: "Geelong Cats", initials: "GC", colors: ["#002b5c", "#f4f7fb"] },
                "Gold Coast": { display: "Gold Coast Suns", initials: "GS", colors: ["#e31b23", "#ffd300"] },
                "Greater Western Sydney": { display: "GWS Giants", initials: "GW", colors: ["#ff6f00", "#3a3a3a", "#ffffff"] },
                Hawthorn: { display: "Hawthorn", initials: "HW", colors: ["#6b3f1d", "#ffcc00"] },
                Melbourne: { display: "Melbourne", initials: "ME", colors: ["#002b5c", "#e31b23"] },
                "North Melbourne": { display: "North Melbourne", initials: "NM", colors: ["#0047bb", "#f7f8fb"] },
                "Port Adelaide": { display: "Port Adelaide", initials: "PA", colors: ["#008c8c", "#111111", "#c0c0c0"] },
                Richmond: { display: "Richmond", initials: "RI", colors: ["#111111", "#fdd000"] },
                "St Kilda": { display: "St Kilda", initials: "ST", colors: ["#e31b23", "#f5f5f5", "#111111"] },
                Sydney: { display: "Sydney Swans", initials: "SS", colors: ["#e31b23", "#f7f7fb"] },
                "West Coast": { display: "West Coast Eagles", initials: "WC", colors: ["#0047bb", "#ffcc00"] },
                "Western Bulldogs": { display: "Western Bulldogs", initials: "WB", colors: ["#0047bb", "#e31b23", "#f7f7fb"] }
            };

            const fixtureTeamByName = new Map(
                Object.entries(fixtureTeams).map(([k, v]) => [v.display.toLowerCase(), k])
            );

            const fallbackFixtures = [];

            for (let r = 1; r <= totalRounds; r++) {
                const round = { round: r, matches: [] };
                const shuffled = Object.keys(fixtureTeams).sort(() => Math.random() - 0.5);
                for (let m = 0; m < 9; m++) {
                    const home = shuffled[m * 2];
                    const away = shuffled[m * 2 + 1];
                    if (!home || !away) break;
                    const homeScore = 50 + Math.floor(Math.random() * 70);
                    const awayScore = 50 + Math.floor(Math.random() * 70);
                    const venues = ["MCG", "Marvel Stadium", "Optus Stadium", "Gabba", "SCG", "Adelaide Oval", "GMHBA Stadium", "Blundstone Arena", "Mars Stadium"];
                    const finished = r < 3 || (r === 3 && m < 4);
                    round.matches.push({
                        homeTeam: home,
                        awayTeam: away,
                        homeScore: finished ? homeScore : null,
                        awayScore: finished ? awayScore : null,
                        venue: venues[m % venues.length],
                        status: finished ? "finished" : (r === 3 ? "live" : "scheduled")
                    });
                }
                fallbackFixtures.push(round);
            }

            const renderRoundDots = () => {
                if (!roundDots) return;
                roundDots.replaceChildren();
                for (let i = 1; i <= totalRounds; i++) {
                    const dot = document.createElement("span");
                    if (i === currentRound) dot.className = "active";
                    roundDots.appendChild(dot);
                }
            };

            const teamInit = (name) => {
                const team = fixtureTeams[fixtureTeamByName.get(name.toLowerCase())];
                return team || { initials: name.slice(0, 2).toUpperCase(), colors: ["#0f5a6d", "#79d7ec"] };
            };

            const applyMatchColors = (el, colors) => {
                el.style.setProperty("--logo-from", colors[0]);
                el.style.setProperty("--logo-to", colors[colors.length - 1]);
            };

            const renderMatches = (round) => {
                if (!fixturesList) return;
                fixturesList.replaceChildren();
                const data = fixturesData || fallbackFixtures;
                const rd = data.find(f => f.round === round);
                if (!rd || !rd.matches.length) {
                    const empty = document.createElement("p");
                    empty.className = "fixtures-empty";
                    empty.textContent = `No fixtures available for Round ${round}.`;
                    fixturesList.appendChild(empty);
                    return;
                }
                rd.matches.forEach(match => {
                    const home = teamInit(match.homeTeam);
                    const away = teamInit(match.awayTeam);
                    const card = document.createElement("div");
                    card.className = "match-card";
                    applyMatchColors(card, home.colors);

                    const homeTeam = document.createElement("div");
                    homeTeam.className = "match-card__team";
                    const homeLogo = document.createElement("span");
                    homeLogo.className = "match-card__logo";
                    homeLogo.textContent = home.initials;
                    homeLogo.setAttribute("aria-hidden", "true");
                    applyMatchColors(homeLogo, home.colors);
                    const homeName = document.createElement("span");
                    homeName.className = "match-card__name";
                    homeName.textContent = home.display;
                    homeTeam.appendChild(homeLogo);
                    homeTeam.appendChild(homeName);

                    const score = document.createElement("div");
                    score.className = "match-card__score";
                    if (match.status === "scheduled") {
                        const vs = document.createElement("span");
                        vs.className = "match-card__vs";
                        vs.textContent = "vs";
                        score.appendChild(vs);
                    } else {
                        const hs = document.createElement("span");
                        hs.className = "match-card__score-value" + (Number(match.homeScore) >= Number(match.awayScore) ? "--winner" : "--loser");
                        hs.textContent = match.homeScore;
                        const vs = document.createElement("span");
                        vs.className = "match-card__vs";
                        vs.textContent = "vs";
                        const as = document.createElement("span");
                        as.className = "match-card__score-value" + (Number(match.awayScore) >= Number(match.homeScore) ? "--winner" : "--loser");
                        as.textContent = match.awayScore;
                        score.appendChild(hs);
                        score.appendChild(vs);
                        score.appendChild(as);
                    }

                    const awayTeam = document.createElement("div");
                    awayTeam.className = "match-card__team match-card__team--away";
                    const awayName = document.createElement("span");
                    awayName.className = "match-card__name";
                    awayName.textContent = away.display;
                    const awayLogo = document.createElement("span");
                    awayLogo.className = "match-card__logo";
                    awayLogo.textContent = away.initials;
                    awayLogo.setAttribute("aria-hidden", "true");
                    applyMatchColors(awayLogo, away.colors);
                    awayTeam.appendChild(awayName);
                    awayTeam.appendChild(awayLogo);

                    const meta = document.createElement("div");
                    meta.className = "match-card__meta";
                    const statusMap = { finished: "Finished", live: "Live", scheduled: "Scheduled" };
                    meta.textContent = `${match.venue} · ${statusMap[match.status] || match.status}`;

                    card.appendChild(homeTeam);
                    card.appendChild(score);
                    card.appendChild(awayTeam);
                    card.appendChild(meta);
                    fixturesList.appendChild(card);
                });
            };

            const goToRound = (r) => {
                if (r < 1 || r > totalRounds) return;
                currentRound = r;
                if (roundNum) roundNum.textContent = String(r);
                renderRoundDots();
                renderMatches(r);
            };

            if (prevBtn) prevBtn.addEventListener("click", () => goToRound(currentRound - 1));
            if (nextBtn) nextBtn.addEventListener("click", () => goToRound(currentRound + 1));

            renderRoundDots();
            goToRound(1);

            fetch("afl-fixtures.json")
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(data => { if (Array.isArray(data) && data.length) { fixturesData = data; goToRound(currentRound); } })
                .catch(() => {});
        })();

        (() => {
            const storageKey = "cgrillo-theme";
            const root = document.documentElement;
            const toggleButton = document.querySelector("[data-theme-toggle]");

            const getStoredTheme = () => {
                try { return localStorage.getItem(storageKey); }
                catch { return null; }
            };

            const setTheme = (theme, persist = true) => {
                root.dataset.theme = theme;
                if (toggleButton) {
                    toggleButton.textContent = theme === "dark" ? "Light mode" : "Dark mode";
                    toggleButton.setAttribute("aria-pressed", String(theme === "dark"));
                }
                const favicon = document.getElementById("favicon");
                if (favicon) favicon.href = theme === "dark" ? "favicon-dark.png" : "favicon.png";
                if (persist) {
                    try { localStorage.setItem(storageKey, theme); }
                    catch { }
                }
            };

            const initialTheme = getStoredTheme() || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            setTheme(initialTheme, false);

            toggleButton?.addEventListener("click", () => {
                setTheme(root.dataset.theme === "dark" ? "light" : "dark");
            });
        })();
    </script>
</body>
</html>
