<!DOCTYPE html>
<html lang="en">
<head>
    <script src="team-names.js"></script>
    <script src="viewer-favourites.js"></script>
    <meta charset="UTF-8">
    <script src="viewer-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AFL Fixtures, Results &amp; Ladder | cgrillo</title>
    <meta name="description" content="AFL fixtures, match results, premiership ladder and player performances.">
    <link rel="canonical" href="https://www.cgrillo.com/afl.html">
    <style>
        :root {
            color-scheme: light;
            --sky-1: #e8fbff;
            --sky-2: #b6edf8;
            --sky-3: #72cfe4;
            --text: #11323f;
            --muted: #4f6d79;
            --brand: #0d4253;
            --brand-soft: #0f5a6d;
            --surface-1: rgba(255, 255, 255, 0.5);
            --surface-2: rgba(255, 255, 255, 0.26);
            --surface-3: rgba(255, 255, 255, 0.08);
            --surface-4: rgba(255, 255, 255, 0.05);
            --line: rgba(255, 255, 255, 0.94);
            --glow: rgba(255, 255, 255, 0.98);
            --shadow: 0 28px 72px rgba(16, 69, 88, 0.24);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --sky-1: #0b2030;
            --sky-2: #102f40;
            --sky-3: #154c61;
            --text: #eaf7fb;
            --muted: #a9c0cb;
            --brand: #e8fbff;
            --brand-soft: #8cd7ea;
            --surface-1: rgba(10, 24, 33, 0.74);
            --surface-2: rgba(8, 19, 27, 0.42);
            --surface-3: rgba(7, 18, 25, 0.22);
            --surface-4: rgba(7, 18, 25, 0.1);
            --line: rgba(188, 235, 248, 0.18);
            --glow: rgba(255, 255, 255, 0.12);
            --shadow: 0 30px 72px rgba(0, 0, 0, 0.34);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.95) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.72) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.88) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.58) 0 4%, transparent 5%),
                linear-gradient(180deg, #f0fdff 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
            overflow-x: hidden;
        }

        :root[data-theme="dark"] body {
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.05) 0 7%, transparent 8%),
                radial-gradient(circle at 24% 28%, rgba(255, 255, 255, 0.03) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.04) 0 8%, transparent 9%),
                radial-gradient(circle at 86% 36%, rgba(255, 255, 255, 0.02) 0 4%, transparent 5%),
                linear-gradient(180deg, #06131b 0%, var(--sky-1) 24%, var(--sky-2) 62%, var(--sky-3) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.22) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.16) 100%),
                radial-gradient(circle at 18% 82%, rgba(255, 255, 255, 0.16), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            mix-blend-mode: screen;
        }

        :root[data-theme="dark"] body::before {
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.08) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.03) 100%),
                radial-gradient(circle at 18% 82%, rgba(72, 177, 210, 0.12), transparent 34%),
                radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.05), transparent 30%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        }

        .page {
            width: min(1200px, calc(100% - 24px));
            margin: 0 auto;
            padding: 20px 0 28px;
        }

        .frame {
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-2)),
                var(--surface-3);
            box-shadow:
                inset 0 1px 0 var(--glow),
                var(--shadow);
            backdrop-filter: blur(28px);
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .frame::before {
            width: 360px;
            height: 360px;
            top: -130px;
            right: -120px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.02) 72%);
        }

        .frame::after {
            width: 300px;
            height: 300px;
            left: -130px;
            bottom: -130px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.02) 72%);
        }

        .masthead {
            position: relative;
            z-index: 1;
            padding: 22px 24px 0;
        }

        .site-banner {
            margin-bottom: 18px;
            padding: 18px 22px;
            border-radius: 26px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 14px 26px rgba(23, 88, 111, 0.12);
            text-align: center;
            backdrop-filter: blur(30px);
        }

        .site-banner h1 {
            margin: 0;
            max-width: none;
            font-size: clamp(2.2rem, 5vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--brand);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .site-banner h1 img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        :root[data-theme="dark"] .site-banner h1 img {
            content: url("favicon-dark.svg");
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
            transition: transform 0.2s ease;
        }

        .nav a:hover { transform: translateY(-1px); }

        .nav a[aria-current="page"] {
            background: #2e7dd2c9;
            color: #fff;
            border-color: #2e7dd2c9;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font: inherit;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 10px 18px rgba(30, 86, 109, 0.1);
            backdrop-filter: blur(24px);
        }

        .theme-toggle:hover { transform: translateY(-1px); }

        .hero {
            position: relative;
            z-index: 1;
            padding: 24px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr minmax(280px, 0.95fr);
            gap: 14px;
            align-items: stretch;
        }

        .top-story {
            padding: 28px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(214, 247, 255, 0.36));
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: inset 0 1px 0 var(--glow);
            color: var(--brand-soft);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .top-story h2 {
            margin: 18px 0 12px;
            max-width: 12ch;
            font-size: clamp(3rem, 8vw, 6.4rem);
            line-height: 0.88;
            letter-spacing: -0.07em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
            color: var(--brand);
        }

        .lead {
            margin: 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.84;
        }

        .ladder-card {
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .ladder-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ladder-card__head h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            color: var(--brand);
        }

        .ladder-list {
            display: grid;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .ladder-row {
            display: grid;
            grid-template-columns: 24px 34px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 11px 12px;
            border-radius: 18px;
            min-width: 0;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 24%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 14%, transparent)),
                rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .ladder-row__pos {
            color: var(--brand-soft);
            font-weight: 800;
            text-align: center;
        }

        .ladder-row__team {
            color: var(--brand);
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ladder-row__logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.42),
                0 0 4px rgba(0, 0, 0, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 14px rgba(14, 68, 88, 0.14);
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(
                    135deg,
                    var(--logo-from, #79d7ec) 0%,
                    var(--logo-from, #79d7ec) 62%,
                    var(--logo-mid, var(--logo-to, #0f5a6d)) 84%,
                    var(--logo-to, #0f5a6d) 100%
                );
        }

        .ladder-row__stats {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            text-align: right;
        }

        .ladder-note {
            margin: 14px 0 0;
            color: var(--brand-soft);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .fixtures-card {
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 18px 36px rgba(23, 88, 111, 0.12);
            backdrop-filter: blur(26px);
        }

        .fixtures-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .fixtures-card__head h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            color: var(--brand);
        }

        .round-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-selector__btn {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface-1), var(--surface-4)),
                var(--surface-4);
            color: var(--brand-soft);
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 1px 0 var(--glow),
                0 6px 12px rgba(30, 86, 109, 0.08);
            backdrop-filter: blur(24px);
            transition: transform 0.15s ease;
            padding: 0;
            line-height: 1;
        }

        .round-selector__btn:hover { transform: translateY(-1px); }

        .round-selector__display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-width: 76px;
        }

        .round-selector__label {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            text-align: center;
            line-height: 1.15;
        }

        .round-selector__value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--brand);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .round-slider {
            width: 100%;
            margin: 4px 0 16px;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 999px;
            background:
                linear-gradient(90deg, var(--brand-soft) var(--fill, 0%), var(--surface-3) var(--fill, 0%));
            outline: none;
            cursor: pointer;
        }

        .round-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: var(--brand);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(14, 68, 88, 0.3);
            cursor: pointer;
        }

        .round-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: var(--brand);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(14, 68, 88, 0.3);
            cursor: pointer;
        }

        .round-slider::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: var(--surface-3);
        }

        .fixtures-list {
            display: grid;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .fixture {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px 14px;
            align-items: center;
            padding: 13px 14px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--logo-from, #dff8ff) 24%, transparent), color-mix(in srgb, var(--logo-to, #ffffff) 14%, transparent)),
                rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
            min-width: 0;
        }

        .fixture__team {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .fixture__team--away {
            text-align: right;
            justify-content: flex-end;
        }

        .fixture__logo {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.42),
                0 0 4px rgba(0, 0, 0, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 14px rgba(14, 68, 88, 0.14);
            flex-shrink: 0;
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.45), transparent 36%),
                linear-gradient(
                    135deg,
                    var(--logo-from, #79d7ec) 0%,
                    var(--logo-from, #79d7ec) 62%,
                    var(--logo-mid, var(--logo-to, #0f5a6d)) 84%,
                    var(--logo-to, #0f5a6d) 100%
                );
        }

        .fixture__name {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--brand);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fixture__score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--brand);
            white-space: nowrap;
        }

        .fixture__score-value--win { color: var(--brand); }

        .fixture__score-value--loss { color: var(--muted); }

        .fixture__vs {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-soft);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .fixture__meta {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .fixture__meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .fixture__status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.32);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.7rem;
        }

        .fixture__status--live {
            background: rgba(231, 62, 62, 0.4);
            border-color: rgba(231, 62, 62, 0.35);
            color: #d64545;
        }

        .fixture__status--scheduled {
            background: rgb(255, 255, 255);
            border-color: rgba(13, 66, 83, 0.18);
            color: var(--brand-soft);
        }

        .fixture__status--finished {
            background: rgb(192, 232, 253);
            border-color: rgba(13, 66, 83, 0.18);
            color: var(--brand-soft);
        }

        :root[data-theme="dark"] .fixture__status--scheduled {
            background: rgb(0, 0, 0);
            border-color: rgba(255, 255, 255, 0.22);
        }

        :root[data-theme="dark"] .fixture__status--finished {
            background: rgb(23, 64, 95);
            border-color: rgba(255, 255, 255, 0.22);
        }

        :root[data-theme="dark"] .fixture__status--live {
            color: #ffffff;
        }

        :root[data-theme="dark"] .live-dot {
            background: #ffffff;
        }

        .fixture__status--tbc {
            background: rgba(255, 204, 0, 0.75);
            border-color: rgba(160, 128, 0, 0.35);
            color: #5a4a00;
        }

        :root[data-theme="dark"] .fixture__status--tbc {
            background: rgba(247, 255, 0, 0.16);
            border-color: rgba(247, 255, 0, 0.3);
            color: #ffffff;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #d64545;
            animation: live-pulse 1.1s ease-in-out infinite;
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }

        .fixtures-empty {
            text-align: center;
            padding: 28px 14px;
            color: var(--muted);
            font-weight: 700;
        }

        .fixtures-note {
            margin: 14px 0 0;
            padding: 9px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px dashed rgba(255, 255, 255, 0.5);
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.45;
        }

        @media (max-width: 980px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .top-story h2 {
                max-width: none;
            }
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 14px, 1200px);
                padding: 8px 0 16px;
            }

            .frame { border-radius: 24px; }

            .masthead,
            .hero {
                padding-left: 14px;
                padding-right: 14px;
            }

            .site-banner { padding: 16px; }

            .topbar {
                display: grid;
                justify-content: initial;
            }

    <script>
        const teams = {
            Adelaide: { display: "Adelaide Crows", initials: "AC", colors: ["#002b5c", "#e31b23", "#ffcc00"] },
            "Brisbane Lions": { display: "Brisbane Lions", initials: "BL", colors: ["#7a003c", "#0047bb", "#ffcc00"] },
            Carlton: { display: "Carlton", initials: "CA", colors: ["#0055cc", "#001a5c"] },
            Collingwood: { display: "Collingwood", initials: "CW", colors: ["#111111", "#f5f5f5"] },
            Essendon: { display: "Essendon", initials: "ES", colors: ["#111111", "#e31b23"] },
            Fremantle: { display: "Fremantle", initials: "FR", colors: ["#5a2ca0", "#f1ebff"] },
            Geelong: { display: "Geelong Cats", initials: "GC", colors: ["#002b5c", "#f7f8fb"] },
            "Gold Coast": { display: "Gold Coast Suns", initials: "GS", colors: ["#e31b23", "#ffd300"] },
            "Greater Western Sydney": { display: "GWS Giants", initials: "GW", colors: ["#ff6f00", "#3a3a3a", "#ffffff"] },
            Hawthorn: { display: "Hawthorn", initials: "HW", colors: ["#6b3f1d", "#ffcc00"] },
            Melbourne: { display: "Melbourne", initials: "ME", colors: ["#002b5c", "#e31b23"] },
            "North Melbourne": { display: "North Melbourne", initials: "NM", colors: ["#0047bb", "#f7f8fb"] },
            "Port Adelaide": { display: "Port Adelaide", initials: "PA", colors: ["#008c8c", "#111111", "#c0c0c0"] },
            Richmond: { display: "Richmond", initials: "RI", colors: ["#111111", "#fdd000"] },
            "St Kilda": { display: "St Kilda", initials: "ST", colors: ["#e31b23", "#f5f5f5", "#111111"] },
            Sydney: { display: "Sydney Swans", initials: "SS", colors: ["#e31b23", "#f7f7fb"] },
            Tasmania: { display: "Tasmania Devils", initials: "TD", colors: ["#005645", "#f8d634", "#e31b23"] },
            "West Coast": { display: "West Coast Eagles", initials: "WC", colors: ["#0047bb", "#ffcc00"] },
            "Western Bulldogs": { display: "Western Bulldogs", initials: "WB", colors: ["#0047bb", "#e31b23", "#f7f7fb"] }
        };

        let savedStandings;
        async function readStandings() {
            const rows = await SportsSnapshots.read("standings.json");
            if (!Array.isArray(rows) || rows.some(row => typeof row?.name !== "string" || !Number.isInteger(row.rank))) {
                throw new Error("Invalid AFL ladder");
            }
            savedStandings = rows;
            return rows;
        }

        (() => {
            const ladderList = document.querySelector("[data-ladder-list]");
            const ladderNote = document.querySelector("[data-ladder-note]");

            if (!ladderList) return;

            const teamByName = new Map(
                Object.entries(teams).map(([key, val]) => [val.display.toLowerCase(), key])
            );

            const renderStandings = (data, sourceText) => {
                const sortedStandings = [...data].sort((first, second) => first.rank - second.rank);
                const rows = sortedStandings.map(standing => {
                    const team = teams[teamByName.get(standing.name.toLowerCase())] || {
                        display: standing.name,
                        initials: standing.name.slice(0, 2).toUpperCase(),
                        colors: ["#0f5a6d", "#79d7ec"]
                    };
                    return {
                        rank: standing.rank,
                        team: { name: team.display, abbreviation: team.initials, color: team.colors[0] },
                        played: standing.played,
                        wins: standing.wins,
                        losses: standing.losses,
                        draws: standing.draws,
                        percentage: standing.percentage,
                        points: standing.pts
                    };
                });
                ladderList.removeAttribute("aria-busy");
                ladderList.innerHTML = SportsUI.renderStandings({ label: "AFL Ladder", rows }, "afl");
                ladderList.querySelectorAll("tbody tr").forEach((row, index) => {
                    SportIdentity.afl(row.querySelector(".sports-identity"), rows[index].team.name);
                });

                if (ladderNote) {
                    ladderNote.textContent = sourceText;
                }
            };

            async function loadStandings() {
                const focused = ladderList.contains(document.activeElement);
                SportsUI.loadingPanel(ladderList, "Loading AFL ladder…", "table");
                try {
                    const data = await readStandings();
                    renderStandings(data, data.length ? "Source: AFL · latest saved ladder." : "");
                    document.dispatchEvent(new Event("afl-ladder-ready"));
                } catch {
                    SportsUI.retryPanel(ladderList, "The AFL ladder is temporarily unavailable.", loadStandings);
                }
                if (focused && document.activeElement === document.body) SportsUI.restorePanelFocus(ladderList);
            }
            loadStandings();
        })();

        (() => {
            const fixturesList = document.querySelector("[data-fixtures-list]");
            const roundLabel = document.querySelector("[data-round-label]");
            const roundValue = document.querySelector("[data-round-value]");
            const roundSlider = document.querySelector("[data-round-slider]");
            const prevBtn = document.querySelector("[data-round-prev]");
            const nextBtn = document.querySelector("[data-round-next]");
            const fixturesNote = document.querySelector("[data-fixtures-note]");

            const MIN_ROUND = 0;
            let maxRound = MIN_ROUND;

            let currentRound = MIN_ROUND;
            let fixturesData = null;
            let roundStatsData = null;
            let statsState = "loading";
            let fixtureSeason;
            const tallies = document.querySelector("[data-round-tallies]");
            const renderTallies = () => {
                if (!fixturesData || !fixturesData.length) return;
                tallies.hidden = false;
                if (statsState === "loading" || statsState === "error" && !roundStatsData) {
                    const heading = document.createElement("h2");
                    heading.id = "afl-round-tallies-title";
                    heading.textContent = "Round player leaders";
                    const panel = document.createElement("div");
                    tallies.replaceChildren(heading, panel);
                    if (statsState === "loading") SportsUI.loadingPanel(panel, "Loading player statistics…");
                    else SportsUI.retryPanel(panel, "AFL player statistics are temporarily unavailable.", loadStats);
                    return;
                }
                AFLRoundView.render(tallies, roundStatsData, currentRound, fixtureSeason);
                if (statsState === "error") {
                    const note = document.createElement("div");
                    SportsUI.retryPanel(note, "The player statistics could not be refreshed. Showing the saved update.", loadStats);
                    tallies.append(note);
                }
            };
            const countdownTimers = [];

            const statusLabels = {scheduled:"Scheduled", finished:"Final", live:"Live", tbc:"TBC", pending:"Update pending", postponed:"Postponed", delayed:"Delayed", suspended:"Suspended", cancelled:"Cancelled", abandoned:"Abandoned"};

            const finalsNames = {
                25: "Wildcard Finals",
                26: "Qualifying & Elimination",
                27: "Semi Finals",
                28: "Preliminary Finals",
                29: "Grand Final"
            };

            const tbdTeam = { display: "TBD", initials: "TBD", colors: ["#6b7b81", "#93a3a8"] };

            const positionTeams = new Map();
            const colorOverrides = new Map();

            const parseStartTime = (value) => {
                if (!value) return null;
                const date = new Date(String(value).replace(/\+0000$/, "Z"));
                return Number.isNaN(date.getTime()) ? null : date;
            };

            const formatWeekOf = (date) => {
                const day = new Intl.DateTimeFormat("sv-SE", { timeZone:"Australia/Sydney", dateStyle:"short" }).format(date);
                const monday = new Date(day + "T00:00:00Z");
                monday.setUTCDate(monday.getUTCDate() - ((monday.getUTCDay() + 6) % 7));
                return `Week of ${monday.toLocaleDateString("en-AU", { timeZone:"UTC", weekday:"long", day:"numeric", month:"long" })}`;
            };

            const resolveTeam = (name) => {
                if (!name) return tbdTeam;
                if (teams[name]) {
                    const entry = teams[name];
                    const colors = colorOverrides.get(entry.display.toLowerCase()) || entry.colors;
                    return { display: entry.display, initials: entry.initials, colors };
                }
                const match = String(name).trim().match(/^(\d{1,2})(st|nd|rd|th)$/i);
                if (match) {
                    return positionTeams.get(Number(match[1])) || tbdTeam;
                }
                return tbdTeam;
            };

            const buildPositionTeams = (standings) => {
                positionTeams.clear();
                if (!Array.isArray(standings)) return;
                const teamByName = new Map(
                    Object.entries(teams).map(([key, val]) => [val.display.toLowerCase(), key])
                );
                standings.forEach(standing => {
                    const rank = Number(standing.rank);
                    if (!Number.isInteger(rank)) return;
                    const key = teamByName.get(String(standing.name || "").toLowerCase());
                    if (key && teams[key]) {
                        const entry = teams[key];
                        const colors = colorOverrides.get(entry.display.toLowerCase()) || entry.colors;
                        positionTeams.set(rank, { display: entry.display, initials: entry.initials, colors });
                    }
                });
            };

            const applyMatchColors = (element, colors) => {
                element.style.setProperty("--logo-from", colors[0]);
                element.style.setProperty("--logo-to", colors[colors.length - 1]);
                if (colors.length > 2) {
                    element.style.setProperty("--logo-mid", colors[1]);
                } else {
                    element.style.removeProperty("--logo-mid");
                }
            };

            const addText = (className, text, parent) => {
                const element = document.createElement("span");
                element.className = className;
                element.textContent = text;
                parent.appendChild(element);
                return element;
            };

            const render = (updateTallies = true) => {
                if (!fixturesList) return;
                countdownTimers.splice(0).forEach(clearInterval);
                if (updateTallies) renderTallies();
                const isFinalsRound = currentRound >= 25;
                if (roundLabel) roundLabel.textContent = finalsNames[currentRound] || "Round";
                if (roundValue) roundValue.textContent = String(currentRound);
                if (roundSlider) {
                    roundSlider.disabled = maxRound === MIN_ROUND;
                    roundSlider.max = String(maxRound);
                    roundSlider.value = String(currentRound);
                    roundSlider.style.setProperty("--fill", `${((currentRound - MIN_ROUND) / Math.max(maxRound - MIN_ROUND, 1)) * 100}%`);
                    roundSlider.setAttribute("aria-valuetext", `${finalsNames[currentRound] || "Round"} ${currentRound}`);
                    FixtureSlider.update(roundSlider, Array.from({length: maxRound - MIN_ROUND + 1}, (_, index) => { const value = MIN_ROUND + index; const dates=(fixturesData?.find(round=>round.round===value)?.matches||[]).map(match=>parseStartTime(match.startTime)).filter(Boolean).sort((a,b)=>a-b); return {value, label:finalsNames[value] || `Round ${value}`, shortLabel:finalsNames[value] ? value === maxRound ? "Final" : `F${value - 24}` : `R${value}`,date:dates[0]?.toISOString(),endDate:dates.at(-1)?.toISOString()}; }));
                }
                prevBtn.disabled = currentRound <= MIN_ROUND;
                nextBtn.disabled = currentRound >= maxRound;
                if (fixturesNote) {
                    fixturesNote.hidden = !isFinalsRound;
                    if (isFinalsRound) {
                        fixturesNote.textContent = "Finals teams may change as results are confirmed.";
                    }
                }
                fixturesList.removeAttribute("aria-busy");
                fixturesList.replaceChildren();

                const round = (fixturesData || []).find(f => f.round === currentRound);
                if (!round || !Array.isArray(round.matches) || !round.matches.length) {
                    const empty = document.createElement("p");
                    empty.className = "fixtures-empty";
                    empty.textContent = `No fixtures for Round ${currentRound}.`;
                    fixturesList.appendChild(empty);
                    return;
                }

                const orderedMatches = AFLRoundView.sortMatches(round.matches);
                const closestFinal = AFLRoundView.closestFinal(orderedMatches, isFinalsRound);
                orderedMatches.forEach((match, index) => {
                    const home = resolveTeam(match.homeTeam);
                    const away = resolveTeam(match.awayTeam);
                    const status = String(match.status || "SCHEDULED").toUpperCase();
                    const startTime = parseStartTime(match.startTime);
                    const now = Date.now();
                    const state = AFLRoundView.matchState(match, now);
                    const isLive = state === "live";
                    const isFinished = state === "finished";
                    const countdownEnd = startTime?.getTime();
                    const isCountdown = state === "scheduled" && countdownEnd - now <= 10 * 60000;
                    const hasScores = (isLive || isFinished) && Number.isFinite(match.homeScore) && Number.isFinite(match.awayScore);

                    const card = document.createElement("div");
                    card.className = `fixture${index === 0 ? " fixture--prime" : index === closestFinal ? " fixture--expanded" : ""}`;
                    if (index === 0) {
                        const prime = document.createElement("div");
                        prime.className = "fixture__prime-label";
                        prime.textContent = "Prime time · First game of the round";
                        card.appendChild(prime);
                    }
                    applyMatchColors(card, home.colors);

                    const homeTeam = document.createElement("div");
                    homeTeam.className = "fixture__team";
                    const homeLogo = document.createElement("span");
                    homeLogo.className = "fixture__logo";
                    homeLogo.textContent = home.initials;
                    SportIdentity.afl(homeLogo, home.display);
                    homeLogo.setAttribute("aria-hidden", "true");
                    applyMatchColors(homeLogo, home.colors);
                    homeTeam.appendChild(homeLogo);
                    homeTeam.appendChild(addText("fixture__name", home.display, homeTeam));

                    const score = document.createElement("div");
                    score.className = "fixture__score";
                    if (hasScores) {
                        const homeScore = Number(match.homeScore);
                        const awayScore = Number(match.awayScore);
                        score.appendChild(addText(homeScore >= awayScore ? "fixture__score-value--win" : "fixture__score-value--loss", String(homeScore), score));
                        score.appendChild(addText("fixture__vs", "vs", score));
                        score.appendChild(addText(awayScore >= homeScore ? "fixture__score-value--win" : "fixture__score-value--loss", String(awayScore), score));
                    } else {
                        score.appendChild(addText("fixture__vs", isLive ? "LIVE" : "vs", score));
                    }

                    const awayTeam = document.createElement("div");
                    awayTeam.className = "fixture__team fixture__team--away";
                    awayTeam.appendChild(addText("fixture__name", away.display, awayTeam));
                    const awayLogo = document.createElement("span");
                    awayLogo.className = "fixture__logo";
                    awayLogo.textContent = away.initials;
                    SportIdentity.afl(awayLogo, away.display);
                    awayLogo.setAttribute("aria-hidden", "true");
                    applyMatchColors(awayLogo, away.colors);
                    awayTeam.appendChild(awayLogo);
                    [[homeTeam, match.homeTeam], [awayTeam, match.awayTeam]].forEach(([element, teamName]) => {
                        const old = element.querySelector('.fixture__name');
                        const link = document.createElement('a');
                        link.className = 'fixture__name';
                        link.href = SportView.teamUrl('afl', {name:teamName});
                        link.textContent = old.textContent;
                        old.replaceWith(link);
                    });

                    const meta = document.createElement("div");
                    meta.className = "fixture__meta";

                    const isUnassignedFinal = isFinalsRound && (status === "PLACEHOLDER" || !startTime);
                    if (isUnassignedFinal && startTime) {
                        meta.appendChild(addText("fixture__meta-item fixture__date", formatWeekOf(startTime), meta));
                    } else if (startTime) {
                        const datePart = startTime.toLocaleDateString("en-AU", { timeZone:"Australia/Sydney", weekday:"short", day:"numeric", month:"short" });
                        const timePart = startTime.toLocaleTimeString("en-AU", { timeZone:"Australia/Sydney", hour:"numeric", minute:"2-digit", timeZoneName:"short" });
                        meta.appendChild(addText("fixture__meta-item fixture__date", `${datePart} · ${timePart}`, meta));
                    } else if (isUnassignedFinal) {
                        meta.appendChild(addText("fixture__meta-item fixture__date", "Week to be confirmed", meta));
                    }
                    if (match.venue && match.venue !== "To Be Confirmed") {
                        meta.appendChild(addText("fixture__meta-item", match.venue, meta));
                    }

                    const statusBadge = document.createElement("span");
                    statusBadge.className = "fixture__status" + (isLive ? " fixture__status--live" : isFinished ? " fixture__status--finished" : state === "scheduled" ? " fixture__status--scheduled" : " fixture__status--tbc");
                    if (isLive) {
                        const dot = document.createElement("span");
                        dot.className = "live-dot";
                        dot.setAttribute("aria-hidden", "true");
                        statusBadge.appendChild(dot);
                    }
                    if (isCountdown) {
                        const formatCountdown = () => {
                            const ms = Math.max(0, countdownEnd - Date.now());
                            const minutes = Math.floor(ms / 60000);
                            const seconds = Math.floor((ms % 60000) / 1000);
                            return `Starts in ${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
                        };
                        statusBadge.textContent = formatCountdown();
                        const timer = setInterval(() => {
                            if (countdownEnd - Date.now() <= 0) {
                                clearInterval(timer);
                                if (statusBadge.isConnected) render();
                            } else {
                                statusBadge.textContent = formatCountdown();
                            }
                        }, 1000);
                        countdownTimers.push(timer);
                    } else {
                        statusBadge.appendChild(document.createTextNode(statusLabels[state]));
                    }
                    meta.appendChild(statusBadge);

                    card.appendChild(homeTeam);
                    card.appendChild(score);
                    card.appendChild(awayTeam);
                    card.appendChild(meta);
                    const gameLink = document.createElement('a');
                    gameLink.className = 'viewer-afl-link';
                    gameLink.href = SportView.matchUrl('afl', match);
                    gameLink.textContent = 'Game centre & player performances →';
                    card.appendChild(gameLink);
                    fixturesList.appendChild(card);
                });
            };

            const goToRound = (round) => {
                currentRound = Math.min(maxRound, Math.max(MIN_ROUND, round));
                render();
                const url = new URL(location.href);
                url.searchParams.set("round", currentRound);
                history.replaceState(null, "", url);
            };

            prevBtn?.addEventListener("click", () => goToRound(currentRound - 1));
            nextBtn?.addEventListener("click", () => goToRound(currentRound + 1));
            roundSlider?.addEventListener("input", (event) => goToRound(Number(event.target.value)));
            async function loadFixtures() {
                const focused = fixturesList.contains(document.activeElement);
                tallies.hidden = true;
                SportsUI.loadingPanel(fixturesList, "Loading AFL fixtures…", "fixtures");
                try {
                    const data = await SportsSnapshots.read("afl-fixtures.json");
                    if (!Array.isArray(data) || data.some(round => !Number.isInteger(round?.round) || !Array.isArray(round.matches) || round.matches.some(match => !match || typeof match !== "object"))) {
                        throw new Error("Invalid AFL fixtures");
                    }
                    if (!data.length) {
                        fixturesList.removeAttribute("aria-busy");
                        fixturesList.textContent = "AFL fixtures have not been published yet.";
                    } else {
                        fixturesData = [...data].sort((a, b) => a.round - b.round);
                        maxRound = fixturesData.at(-1).round;
                        const firstDate = fixturesData.flatMap(round => round.matches).map(match => parseStartTime(match.startTime)).find(Boolean);
                        fixtureSeason = firstDate?.getUTCFullYear();
                        buildPositionTeams(savedStandings);
                        const requested = new URLSearchParams(location.search).get("round");
                        const linkedRound = fixturesData.find(round => String(round.round) === requested);
                        goToRound(linkedRound?.round ?? AFLRoundView.defaultRound(fixturesData));
                    }
                } catch {
                    SportsUI.retryPanel(fixturesList, "AFL fixtures are temporarily unavailable.", loadFixtures);
                }
                if (focused && document.activeElement === document.body) SportsUI.restorePanelFocus(fixturesList);
            }
            async function loadStats() {
                const focused = tallies.contains(document.activeElement);
                if (!roundStatsData) {
                    statsState = "loading";
                    renderTallies();
                }
                try {
                    const data = await SportsSnapshots.read("afl-player-stats.json");
                    if (!Number.isInteger(data?.season) || !data.rounds || typeof data.rounds !== "object") {
                        throw new Error("Invalid AFL player statistics");
                    }
                    roundStatsData = data;
                    statsState = "ready";
                } catch {
                    statsState = "error";
                }
                renderTallies();
                if (focused && document.activeElement === document.body && !tallies.hidden) SportsUI.restorePanelFocus(tallies);
            }
            function refreshTeams() {
                buildPositionTeams(savedStandings);
                if (fixturesData?.length && !fixturesList.contains(document.activeElement)) render(false);
            }
            document.addEventListener("afl-ladder-ready", refreshTeams);
            loadFixtures();
            loadStats();
            SportsSnapshots.read("team-colors.json").then(colors => {
                Object.entries(colors || {}).forEach(([name, entry]) => {
                    if (Array.isArray(entry?.colors)) colorOverrides.set(name.toLowerCase(), entry.colors);
                });
                refreshTeams();
            }).catch(() => {});
            setInterval(() => {
                if (!document.hidden) loadStats();
            }, 15 * 60000);
        })();
    </script>
</body>
</html>
