name: Update AFL standings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and extract AFL standings
        run: |
          curl -s "https://aflapi.afl.com.au/afl/v2/compseasons/85/ladders" | \
          jq '[.ladders[0].entries[] | {
            rank: .position,
            name: .team.name,
            played: .thisSeasonRecord.winLossRecord.played,
            wins: .thisSeasonRecord.winLossRecord.wins,
            losses: .thisSeasonRecord.winLossRecord.losses,
            draws: .thisSeasonRecord.winLossRecord.draws,
            pts: .thisSeasonRecord.aggregatePoints,
            percentage: .thisSeasonRecord.percentage,
            "for": .pointsFor,
            against: .pointsAgainst
          }]' > standings.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add standings.json
          if ! git diff --quiet --cached; then
            git commit -m "Update AFL standings"
            git push
          fi
