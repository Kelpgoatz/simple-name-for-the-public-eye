name: Update historical team and tennis records
on:
  schedule:
    - cron: '38 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-team-careers.mjs'
      - 'scripts/lib/team-careers.mjs'
      - '.github/workflows/update-team-careers.yml'
permissions:
  contents: write
concurrency:
  group: update-team-careers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh archived records and verified honours
        id: refresh
        continue-on-error: true
        run: node scripts/update-team-careers.mjs
      - name: Save successful archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sports-data/*-careers.json
          if ! git diff --quiet --cached; then
            git commit -m "Update historical sports records"
            git pull --rebase origin main
            git push
          fi
      - name: Report unavailable archive
        if: steps.refresh.outcome == 'failure'
        run: exit 1
