name: Update F1 constructors championship

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-f1-constructors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch F1 constructors championship
        run: node scripts/update-f1-standings.mjs constructors

      - name: Commit and push if changed
        run: node scripts/save-data.mjs "Update F1 constructors championship" constructors-championship.json
