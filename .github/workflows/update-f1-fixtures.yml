name: Update F1 fixtures and results

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/lib/f1-source.mjs'
      - 'scripts/lib/jolpica-client.mjs'
      - 'scripts/save-data.mjs'
      - scripts/update-f1-fixtures.mjs
      - scripts/update-f1-penalties.mjs
      - scripts/update-f1-grids.mjs
      - scripts/update-f1-sessions.mjs
      - .github/workflows/update-f1-fixtures.yml

permissions:
  contents: write

concurrency:
  group: update-f1-fixtures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch calendar, race classifications and fastest laps
        run: node scripts/update-f1-fixtures.mjs
      - name: Fetch practice, qualifying and sprint sessions
        run: node scripts/update-f1-sessions.mjs
      - name: Import penalty notes from official F1 result pages
        run: node scripts/update-f1-penalties.mjs
      - name: Confirm missing grids and pit-lane starts against official F1 starting grids
        run: node scripts/update-f1-grids.mjs
      - name: Commit and push if changed
        run: node scripts/save-data.mjs "Update F1 fixtures and results" f1-fixtures.json f1-penalties.json f1-sessions.json
