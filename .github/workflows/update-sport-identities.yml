name: Update AFL logos and F1 identities
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/f1-source.mjs'
      - 'scripts/lib/jolpica-client.mjs'
      - 'scripts/save-data.mjs'
      - 'scripts/update-sport-identities.mjs'
      - 'scripts/lib/identity-utils.mjs'
      - 'driver-nationalities.json'
      - '.github/workflows/update-sport-identities.yml'
permissions:
  contents: write
concurrency:
  group: update-sport-identities
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh logos and driver flags
        id: refresh
        continue-on-error: true
        run: node scripts/update-sport-identities.mjs
      - name: Save available identity updates
        run: node scripts/save-data.mjs "Update AFL and F1 logos and flags" sport-identities.json
      - name: Report incomplete source refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
