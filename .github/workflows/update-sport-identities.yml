name: Update AFL logos and F1 identities
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-sport-identities.mjs'
      - 'scripts/lib/identity-utils.mjs'
      - 'driver-nationalities.json'
      - '.github/workflows/update-sport-identities.yml'
permissions:
  contents: write
concurrency:
  group: update-sport-identities
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh logos and driver flags
        id: refresh
        continue-on-error: true
        run: node scripts/update-sport-identities.mjs
      - name: Save available identity updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sport-identities.json
          if ! git diff --quiet --cached; then
            git commit -m "Update AFL and F1 logos and flags"
            git pull --rebase origin main
            git push
          fi
      - name: Report incomplete source refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
