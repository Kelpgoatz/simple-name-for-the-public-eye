name: Update Formula 2
on:
  schedule:
    - cron: '21,51 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-f2.mjs'
      - 'scripts/lib/f2-source.mjs'
      - '.github/workflows/update-f2.yml'
permissions:
  contents: write
concurrency:
  group: update-f2
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import official calendar, sessions and standings
        id: refresh
        continue-on-error: true
        run: node scripts/update-f2.mjs
      - name: Save available updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f2-data.json
          if ! git diff --quiet --cached; then
            git commit -m "Update F2 fixtures and standings"
            git pull --rebase origin main
            git push
          fi
      - name: Report incomplete import
        if: steps.refresh.outcome == 'failure'
        run: exit 1
