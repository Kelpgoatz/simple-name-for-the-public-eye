name: Update men's and women's sports fixtures and ladders

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/save-data.mjs'
      - 'scripts/update-sports.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/update-sports.yml'

permissions:
  contents: write

concurrency:
  group: update-sports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh all eight sports from their current-season APIs
        id: refresh
        continue-on-error: true
        run: node scripts/update-sports.mjs
      - name: Save successfully refreshed data
        run: node scripts/save-data.mjs "Update sports fixtures and standings" sports-data/*.json
      - name: Report upstream failures after preserving successful updates
        if: steps.refresh.outcome == 'failure'
        run: exit 1
