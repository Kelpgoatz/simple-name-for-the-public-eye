name: Update F1 drivers championship

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch F1 drivers championship
        run: |
          year=$(date +%Y)
          curl -s "https://f1api.dev/api/$year/drivers-championship" | \
            jq '.' > drivers-championship.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drivers-championship.json
          if ! git diff --quiet --cached; then
            git commit -m "Update F1 drivers championship"
            git push
          fi
