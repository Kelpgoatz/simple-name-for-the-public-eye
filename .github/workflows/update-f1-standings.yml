name: Update F1 drivers championship

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch F1 drivers championship
        run: node scripts/update-f1-standings.mjs drivers

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drivers-championship.json
          if ! git diff --quiet --cached; then
            git commit -m "Update F1 drivers championship"
            git pull --rebase origin main
            git push
          fi
