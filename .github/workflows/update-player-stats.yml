name: Update multi-sport player performances
on:
  schedule:
    - cron: '18,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/boxscore-availability.mjs'
      - 'scripts/save-data.mjs'
      - 'scripts/update-player-stats.mjs'
      - 'scripts/lib/player-performance.mjs'
      - '.github/workflows/update-player-stats.yml'
permissions:
  contents: write
concurrency:
  group: update-player-performances
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import available box scores
        id: refresh
        continue-on-error: true
        run: node scripts/update-player-stats.mjs
      - name: Preserve successful updates
        run: node scripts/save-data.mjs "Update player performances" sports-data/*-players.json
      - name: Report unavailable box scores
        if: steps.refresh.outcome == 'failure'
        run: exit 1
